name: Build ALRAZZAQ APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME}"

          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not set"
            exit 1
          fi

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager 2>/dev/null |
              sort |
              tail -n 1 || true
            )"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] ||
             [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then

            "$SDKMANAGER" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0"
          fi

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: ALRAZZAQ_ANDROID
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        working-directory: ALRAZZAQ_ANDROID
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALRAZZAQ-debug-apk
          path: ALRAZZAQ_ANDROID/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
