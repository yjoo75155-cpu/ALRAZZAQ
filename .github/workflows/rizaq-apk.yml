name: RIZAQ BUILD FINAL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          echo "SDK: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        shell: bash
        run: |
          set -e

          ROOT=""

          while IFS= read -r file; do
            DIR="$(dirname "$file")"

            if [ -f "$DIR/settings.gradle" ] &&
               [ -f "$DIR/app/build.gradle" ]; then
              ROOT="$DIR"
              break
            fi
          done < <(find . -name settings.gradle -type f)

          if [ -z "$ROOT" ]; then
            echo "Android project not found."
            echo "Project structure:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          ROOT="${ROOT#./}"

          echo "ANDROID_PROJECT=$ROOT" >> "$GITHUB_ENV"
          echo "Android project found at: $ROOT"

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          echo "Building:"
          pwd

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK="$(find "$ANDROID_PROJECT/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            2>/dev/null | head -n 1)"

          if [ -z "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          echo "APK FOUND:"
          ls -lh "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/rizaq.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RIZAQ-APK
          path: rizaq.apk
          if-no-files-found: error
