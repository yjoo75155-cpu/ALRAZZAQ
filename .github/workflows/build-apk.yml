name: Build الرزاق APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER=""

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              2>/dev/null | sort | tail -n 1)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK ready"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build الرزاق APK
        shell: bash
        run: |
          set -e

          echo "Building from:"
          pwd

          echo "Checking Android project..."
          test -f settings.gradle
          test -f build.gradle
          test -d app

          echo "Android project found."

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "================================"
          echo "APK GENERATED SUCCESSFULLY"
          echo "================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: الرزاق-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
