name: RIZAQ FINAL APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RIZAQ APK
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Project
        run: |
          echo "Current directory:"
          pwd

          echo "Files:"
          ls -la

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

          echo "Android project detected."

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              2>/dev/null | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK READY"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show Gradle
        run: |
          gradle --version

      - name: Build Debug APK
        run: |
          set -e

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK NOT FOUND"
            exit 1
          fi

          echo "======================================"
          echo "       RIZAQ APK BUILD SUCCESS"
          echo "======================================"

          ls -lh "$APK"

          echo "SHA256:"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RIZAQ-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
